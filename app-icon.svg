<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EE5A5A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <!-- Timer ring background -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="24" opacity="0.3"/>
  <!-- Timer ring progress (showing ~75%) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="24"
          stroke-dasharray="848" stroke-dashoffset="212"
          stroke-linecap="round" transform="rotate(-90 256 256)"/>
  <!-- Center play button hint -->
  <polygon points="230,190 230,322 330,256" fill="#ffffff" opacity="0.9"/>
</svg>
